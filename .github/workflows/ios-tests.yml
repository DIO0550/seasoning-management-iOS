name: iOS tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.name }}
    # Distinct keys combine both matrix results regardless of completion order.
    outputs:
      unit_report: ${{ steps.collect.outputs.unit_report }}
      ui_report: ${{ steps.collect.outputs.ui_report }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Unit tests
            target: SeasoningManagerTests
          - name: UI tests
            target: SeasoningManagerUITests
    # iOS 27.0 is the minimum deployment target decided in #13.
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      PROJECT: src/SeasoningManager/SeasoningManager.xcodeproj
      SCHEME: SeasoningManager
      TEST_TARGET: ${{ matrix.target }}
    defaults:
      run:
        shell: bash
    steps:
      # Only GitHub-owned actions are allowed; pin every action to a full commit SHA.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Xcode, schemes, and simulators
        run: |
          xcodebuild -version
          xcodebuild -list -project "$PROJECT"
          xcrun simctl list devices available
          xcodebuild -showdestinations -project "$PROJECT" -scheme "$SCHEME"

      - name: Select and boot an available iOS 27.0 simulator
        run: |
          simulator_id=$(xcrun simctl list devices available --json | jq -er '
            [.devices["com.apple.CoreSimulator.SimRuntime.iOS-27-0"][]?
             | select(.isAvailable and (.name | startswith("iPhone")))][0].udid
            // error("No available iPhone simulator for iOS 27.0")
          ')
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          echo "Selected simulator: $simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b

      - name: Run tests
        env:
          HARNESS_RESULT_BUNDLE: ${{ runner.temp }}/${{ matrix.target }}.xcresult
        run: |
          bash harness/test-ios.sh "$TEST_TARGET" "platform=iOS Simulator,id=$SIMULATOR_ID"

      - name: Collect results for PR comment
        id: collect
        if: always()
        env:
          HARNESS_RESULT_BUNDLE: ${{ runner.temp }}/${{ matrix.target }}.xcresult
        run: |
          python3 harness/ci-report.py

  report:
    name: Report iOS test results
    needs: tests
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      # The issue-comment endpoint checks both scopes for PR timeline comments.
      issues: write
      pull-requests: write
    steps:
      # No PR checkout or execution in the job with comment permission.
      - name: Summarize and update PR comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          UNIT_REPORT: ${{ needs.tests.outputs.unit_report }}
          UI_REPORT: ${{ needs.tests.outputs.ui_report }}
        with:
          script: |
            const marker = '<!-- seasoning-ios-test-report -->';
            const { owner, repo } = context.repo;
            const runId = Number(process.env.GITHUB_RUN_ID);
            const attempt = Number(process.env.GITHUB_RUN_ATTEMPT);
            const pr = context.payload.pull_request;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${runId}/attempts/${attempt}`;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
              owner, repo, run_id: runId, attempt_number: attempt, per_page: 100
            });

            function readReport(variable) {
              try {
                const raw = process.env[variable];
                if (!raw || raw.length > 60_000) {
                  return null;
                }
                const report = JSON.parse(raw);
                if (report?.runId !== String(runId) || report?.attempt !== String(attempt)) {
                  return null;
                }
                return report;
              } catch {
                return null;
              }
            }

            function count(value) {
              if (!Number.isSafeInteger(value) || value < 0) {
                return '未取得';
              }
              return String(value);
            }

            function duration(item) {
              if (item?.conclusion === 'skipped') {
                return '未実施';
              }
              if (!item?.started_at || !item?.completed_at) {
                return '未取得';
              }
              const seconds = (Date.parse(item.completed_at) - Date.parse(item.started_at)) / 1000;
              if (!Number.isFinite(seconds) || seconds < 0) {
                return '未取得';
              }
              const rounded = Math.round(seconds);
              return `${Math.floor(rounded / 60)}分${rounded % 60}秒`;
            }

            function coverage(report) {
              const covered = report?.coveredLines;
              const executable = report?.executableLines;
              if (count(covered) === '未取得' || count(executable) === '未取得') {
                return '未取得';
              }
              if (executable === 0 || covered > executable) {
                return '未取得';
              }
              return `${(100 * covered / executable).toFixed(2)}% (${covered}/${executable}行)`;
            }

            function coverageBadge(report) {
              const value = coverage(report);
              if (value === '未取得') {
                return '⚪ 未取得';
              }
              const badge = report.coveredLines / report.executableLines >= 0.8 ? '🟢' : '🟠';
              return `${badge} ${value}`;
            }

            function label(value) {
              if (typeof value !== 'string' || !value.trim()) {
                return '未取得';
              }
              const text = value.replace(/\s+/g, ' ').slice(0, 240);
              const suffix = value.replace(/\s+/g, ' ').length > 240 ? '…' : '';
              return text.replace(/[&<>|`\\\[\]*_]/g, char => `&#${char.codePointAt(0)};`) + suffix;
            }

            function fileName(path) {
              if (typeof path !== 'string') {
                return '未取得';
              }
              const relative = path.replace(/^.*\/(?=src\/SeasoningManager\/)/, '');
              if (relative.startsWith('src/')) {
                return label(relative.replace(/^src\/SeasoningManager\/(?:SeasoningManager\/)?/, ''));
              }
              return label(relative.split('/').pop());
            }

            function testSeconds(test) {
              if (test?.result === 'Skipped') {
                return null;
              }
              if (typeof test?.seconds !== 'number' || !Number.isFinite(test.seconds) || test.seconds < 0) {
                return null;
              }
              return test.seconds;
            }

            const testStatuses = { Passed: '✅ 成功', Failed: '❌ 失敗', Skipped: '⏭️ スキップ', 'Expected Failure': '🟡 想定内の失敗' };
            function testRow(test) {
              const seconds = testSeconds(test);
              let time = '未取得';
              if (test?.result === 'Skipped') {
                time = '未実施';
              } else if (seconds !== null) {
                time = `${seconds.toFixed(3)}秒`;
              }
              return `| ${label(test?.name)} | ${testStatuses[test?.result] ?? '未取得'} | ${time} |`;
            }

            function fileRow(file) {
              return `| ${fileName(file?.path)} | ${coverageBadge(file)} |`;
            }

            // Bound each table so the whole comment fits GitHub's text limit.
            function table(headers, rows, budget) {
              const output = [...headers];
              let size = output.join('\n').length;
              let shown = 0;
              for (const row of rows) {
                if (size + row.length + 1 > budget) {
                  break;
                }
                output.push(row);
                size += row.length + 1;
                shown++;
              }
              if (shown < rows.length) {
                output.push('', `⚠️ ${rows.length - shown}件省略（文字数上限）`);
              }
              return output;
            }

            const fileHeaders = ['| ファイル | 行カバレッジ |', '| --- | --- |'];
            const testHeaders = ['| テスト | 結果 | 時間 |', '| --- | --- | ---: |'];
            const statuses = {
              success: '✅ 成功', failure: '❌ 失敗', cancelled: '🚫 取消', skipped: '⏭️ スキップ',
              timed_out: '⏰ タイムアウト', action_required: '🟡 対応待ち', neutral: '⚪ 中立'
            };
            const lines = [
              marker,
              `<!-- ios-test-run:${runId}:${attempt} -->`,
              `<!-- ios-test-commit:${context.sha} -->`,
              '### iOS CI', '',
              `[${pr.head.sha.slice(0, 7)}](${context.serverUrl}/${owner}/${repo}/commit/${pr.head.sha}) · [実行ログ #${runId} / ${attempt}](${runUrl})`, '',
              '#### 🧪 テスト結果', '',
              '| 検証 | CI | ✅ 成功 | ❌ 失敗 | ⏭️ スキップ |',
              '| --- | --- | ---: | ---: | ---: |'
            ];
            const reports = [
              ['Unit tests', 'Unit', 'UNIT_REPORT'], ['UI tests', 'UI', 'UI_REPORT']
            ].map(([jobName, name, variable]) => {
              const job = jobs.find(job => job.name === jobName);
              // Partial reruns can retain older outputs; never display those as this attempt.
              const report = job ? readReport(variable) : null;
              return { name, job, report };
            });
            for (const { name, job, report } of reports) {
              const summary = report?.summary;
              const status = statuses[job?.conclusion] ?? '⚪ 未完了・未取得';
              lines.push(`| ${name} | ${status} | ${count(summary?.passedTests)} | ${count(summary?.failedTests)} | ${count(summary?.skippedTests)} |`);
            }
            for (const { name, report } of reports) {
              if (Array.isArray(report?.errors) && report.errors.length) {
                lines.push('', `⚠️ ${name}：一部収集失敗`);
              }
            }

            lines.push('', '---', '', '#### 📊 カバレッジ', '',
              '| 検証 | アプリ行カバレッジ |', '| --- | --- |');
            for (const { name, report } of reports) {
              lines.push(`| ${name} | ${coverageBadge(report?.coverage)} |`);
            }
            lines.push('', '##### 🟠 80%未満 · 下位10件', '');
            for (const { name, report } of reports) {
              const files = report?.coverage?.files;
              if (!Array.isArray(files)) {
                lines.push(`**${name}** · ⚪ 未取得`, '');
                continue;
              }
              const measured = files.filter(file => coverage(file) !== '未取得');
              if (!measured.length) {
                lines.push(`**${name}** · ⚪ 計測なし`, '');
                continue;
              }
              const low = measured
                .filter(file => file.coveredLines / file.executableLines < 0.8)
                .sort((a, b) => a.coveredLines / a.executableLines - b.coveredLines / b.executableLines);
              const missing = files.length - measured.length;
              if (missing > 0) {
                lines.push(`⚪ ${name}：未取得 ${missing}件`, '');
              }
              if (!low.length) {
                lines.push(`**${name}** · ✅ 該当なし`, '');
                continue;
              }
              lines.push(`**${name}** · ${low.length}件`, '',
                ...table(fileHeaders, low.slice(0, 10).map(fileRow), 3500), '');
            }
            for (const { name, report } of reports) {
              lines.push('<details>', `<summary>📂 ${name} · ファイル別</summary>`, '');
              const files = report?.coverage?.files;
              if (Array.isArray(files) && files.length) {
                const sorted = [...files].sort((a, b) => String(a?.path).localeCompare(String(b?.path)));
                lines.push(...table(fileHeaders, sorted.map(fileRow), 10_000));
              } else {
                lines.push(Array.isArray(files) ? '0件' : '⚪ 未取得');
              }
              const omitted = report?.omitted?.files;
              if (Number.isSafeInteger(omitted) && omitted > 0) {
                lines.push('', `⚠️ ファイル詳細 ${omitted}件省略（転送上限）`);
              }
              lines.push('', '</details>', '');
            }

            lines.push('---', '', '#### ⏱️ 実行時間', '',
              '| 検証 | ビルド＋テスト | ジョブ全体 |', '| --- | ---: | ---: |');
            for (const { name, job } of reports) {
              const testStep = job?.steps?.find(step => step.name === 'Run tests');
              lines.push(`| ${name} | ${duration(testStep)} | ${duration(job)} |`);
            }
            lines.push('', '##### 🐢 遅いテスト · 上位10件', '');
            for (const { name, report } of reports) {
              const tests = report?.tests;
              if (!Array.isArray(tests)) {
                lines.push(`**${name}** · ⚪ 未取得`, '');
                continue;
              }
              const slow = tests.filter(test => testSeconds(test) !== null)
                .sort((a, b) => b.seconds - a.seconds).slice(0, 10);
              if (!slow.length) {
                lines.push(`**${name}** · ⚪ 計測なし`, '');
                continue;
              }
              lines.push(`**${name}**`, '', ...table(testHeaders, slow.map(testRow), 3500), '');
            }
            for (const { name, report } of reports) {
              lines.push('<details>', `<summary>🔎 ${name} · 全テスト</summary>`, '');
              const tests = report?.tests;
              if (Array.isArray(tests) && tests.length) {
                const sorted = [...tests].sort((a, b) => String(a?.name).localeCompare(String(b?.name)));
                lines.push(...table(testHeaders, sorted.map(testRow), 10_000));
              } else {
                lines.push(Array.isArray(tests) ? '0件' : '⚪ 未取得');
              }
              const omitted = report?.omitted?.tests;
              if (Number.isSafeInteger(omitted) && omitted > 0) {
                lines.push('', `⚠️ テスト詳細 ${omitted}件省略（転送上限）`);
              }
              lines.push('', '</details>', '');
            }
            const body = lines.join('\n');
            await core.summary.addRaw(body).write();

            if (pr.head.repo?.full_name !== `${owner}/${repo}`) {
              core.info('Fork PR: read-only token; report is available in the step summary.');
              return;
            }
            const { data: current } = await github.rest.pulls.get({ owner, repo, pull_number: pr.number });
            if (current.state !== 'open' || current.head.sha !== pr.head.sha) {
              core.info('PR is closed or its head changed; skipping outdated comment.');
              return;
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100
            });
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker)
            );
            if (existing) {
              const previous = existing.body.match(/<!-- ios-test-run:(\d+):(\d+) -->/);
              if (previous && (Number(previous[1]) > runId ||
                  (Number(previous[1]) === runId && Number(previous[2]) > attempt))) {
                core.info('A newer run already reported; skipping outdated comment.');
                return;
              }
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              return;
            }
            await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
