</style></head><body><div class="layout"><aside><div class="brand">S<span>tock</span></div><p class="eyebrow">SEASONING MANAGER</p><h1>いつもの味を、<br>使いきる。</h1><p class="aside-copy">キッチンにある調味料と、<br>次に使いたい一本がひと目で。</p><div class="aside-bottom"><span class="demo-dot"></span> UI PROTOTYPE · 06<br><small>架空のデータを使用しています<br>変更はこの画面を開いている間だけ有効です</small></div></aside><main id="app" aria-live="polite"></main></div><div id="toast" role="status"></div><script>
const app=document.getElementById('app');
const TODAY='2026-10-02';
let products=[{id:1,name:'丸大豆しょうゆ',brand:'ひなた醸造',type:'しょうゆ',size:'500 mL',mark:'醤',tone:'#f0e7dc',ink:'#7b5338',nutrition:{basisQuantity:'15',basisUnit:'mL',energy:'13',protein:'1.3',fat:'0',carbohydrate:'1.1',salt:'2.4'}},{id:2,name:'純正ごま油',brand:'つむぎ製油',type:'油',size:'200 g',mark:'油',tone:'#f6efda',ink:'#99762f'},{id:3,name:'米みそ',brand:'山里の蔵',type:'みそ',size:'750 g',mark:'味',tone:'#efe4de',ink:'#916149'},{id:4,name:'穀物酢',brand:'ひなた醸造',type:'酢',size:'500 mL',mark:'酢',tone:'#e8eee1',ink:'#6f7d4b'},{id:5,name:'本みりん',brand:'花野',type:'みりん',size:'500 mL',mark:'み',tone:'#f3eadb',ink:'#967a43'}];
let stocks=[{id:101,pid:1,expiry:'2026-10-08',opened:'2026-09-18',location:'冷蔵庫'},{id:102,pid:2,expiry:'2026-10-14',opened:'2026-09-02',location:'常温'},{id:103,pid:3,expiry:'2026-11-20',opened:'2026-09-25',location:'冷蔵庫'},{id:104,pid:4,expiry:'2027-02-28',opened:'',location:'常温'},{id:105,pid:1,expiry:'2027-03-31',opened:'',location:'常温'},{id:106,pid:5,expiry:'2027-05-15',opened:'',location:'常温'}];
let types=[...new Set(products.map(p=>p.type))];
let preferences={location:'常温',soonDays:14};
let imageVersion=0,typeEditorOpen=false;
let activeTab='stock',templateQuery='',templateId=null,templateEditId=null,formOrigin='stock',returnView='list';
let view='list',filter='すべて',query='',selected=null,draft={},undoAction=null,toastTimer;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const prod=id=>products.find(p=>p.id===id);const stock=id=>stocks.find(s=>s.id===id);const days=s=>s.expiry?Math.round((new Date(s.expiry+'T00:00:00')-new Date(TODAY+'T00:00:00'))/86400000):null;
const date=s=>s?s.replaceAll('-',' / '):'未設定';const short=s=>s?s.slice(5).replace('-','/'):'期限未設定';
const icon=p=>p.image?`<span class="monogram photo"><img src="${esc(p.image)}" alt="${esc(p.name||'商品画像')}"></span>`:`<span class="monogram" style="--tone:${p.tone||'#e8eee6'};--ink:${p.ink||'#526f53'}">${esc(p.mark||p.type[0])}</span>`;
const status=s=>`<span class="pill ${s.opened?'opened':''}">${s.opened?'開封済み':'未開封'}</span>`;
function deadline(s){let d=days(s);return `<span class="expiry ${d!==null&&d<=preferences.soonDays?'soon':''}">${d===null?'賞味期限 未設定':d<0?'賞味期限 '+Math.abs(d)+'日経過':d===0?'賞味期限 今日':d<=preferences.soonDays?'賞味期限 あと'+d+'日':'賞味期限 '+short(s.expiry)}</span>`}
const bar=(title,action='list',label='戻る')=>`<div class="backbar"><button class="text-btn" data-action="${action}">${label}</button><strong>${title}</strong><span aria-hidden="true"></span></div><!--shell-header-->`;
function list(){let shown=stocks.filter(s=>{let p=prod(s.pid);return (filter==='すべて'||filter==='開封済み'&&s.opened||filter==='未開封'&&!s.opened||filter==='期限が近い'&&days(s)!==null&&days(s)<=preferences.soonDays)&&(p.name+p.brand+p.type).includes(query)}).sort((a,b)=>(a.expiry||'9999').localeCompare(b.expiry||'9999'));return `<header><div class="topline"><span class="date">10月2日 金曜日</span><span class="demo">UIモック</span></div><div class="heading-row"><h2>調味料ストック</h2></div></header><!--shell-header--><section class="list-tools"><p class="summary">${stocks.length}個の在庫 · ${stocks.filter(s=>s.opened).length}個を開封中</p><label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/></svg><input id="search" aria-label="調味料を検索" placeholder="商品名・種類で検索" value="${esc(query)}"></label><div class="tabs" role="group" aria-label="在庫の絞り込み">${['すべて','開封済み','未開封','期限が近い'].map(t=>`<button class="tab ${filter===t?'selected':''}" aria-pressed="${filter===t}" data-filter="${t}">${t}</button>`).join('')}</div></section><div class="content"><div class="section-label"><strong>${filter==='すべて'?'キッチンの在庫':filter}</strong><span>賞味期限が近い順 · ${shown.length}個</span></div><div class="list">${shown.map(s=>row(s)).join('')||'<div class="empty">該当する在庫はありません<br>条件を変えてみてください</div>'}</div><p class="footnote">同じ商品も、一本ずつ管理できます<br>デモの日付：2026年10月2日</p></div>`}
function row(s){let p=prod(s.pid);return `<button class="stock-row" data-stock="${s.id}">${icon(p)}<span class="stock-main"><span class="name">${esc(p.name)}</span><span class="sub">${esc(p.brand)} · ${esc(p.size)}</span><span class="badges">${status(s)}${deadline(s)}</span></span><span class="chevron" aria-hidden="true">›</span></button>`}
function detail(){let s=stock(selected),p=prod(s.pid);return bar('在庫の詳細')+`<div class="detail-hero">${icon(p)}<h2>${esc(p.name)}</h2><span class="sub">${esc(p.brand)} · ${esc(p.size)}</span><div style="margin-top:13px">${status(s)}</div></div><section class="group"><h3 class="group-title">この一本の情報</h3><div class="info"><div class="info-row"><span>賞味期限</span><span>${date(s.expiry)}<br>${deadline(s)}</span></div><div class="info-row"><span>開封日</span><span>${s.opened?date(s.opened):'まだ開封していません'}</span></div><div class="info-row"><span>保管場所</span><span>${esc(s.location)}</span></div></div><p class="note">賞味期限は商品に記載された日付です。開封後は商品の保存方法を確認してください。</p></section><section class="group"><h3 class="group-title">商品情報</h3><div class="info"><button class="wide-link" data-product="${p.id}"><span>種類・栄養成分・ほかの在庫</span><span class="chevron">›</span></button></div></section><div class="actions">${!s.opened?'<button class="secondary" data-action="openstock">今日、開封した</button>':''}<button class="primary" data-action="useup">使い切る</button></div><p class="footnote">使い切り済みにした後も、取り消せます</p>`}
function productDetail(){let p=prod(draft.productId),ss=stocks.filter(s=>s.pid===p.id);return bar('商品情報','detail')+`<div class="detail-hero">${icon(p)}<h2>${esc(p.name)}</h2><span class="sub">${esc(p.brand)}</span></div><section class="group"><h3 class="group-title">同じ商品で共通の情報</h3><div class="info"><div class="info-row"><span>種類</span><span>${esc(p.type)}</span></div><div class="info-row"><span>内容量</span><span>${esc(p.size)}</span></div><details><summary>栄養成分（任意）</summary>${p.nutrition?`<div class="info-row"><span>基準量</span><span>${esc(p.nutrition.basisQuantity)} ${esc(p.nutrition.basisUnit)} あたり</span></div>${[['energy','エネルギー','kcal'],['protein','たんぱく質','g'],['fat','脂質','g'],['carbohydrate','炭水化物','g'],['salt','食塩相当量','g']].filter(([k])=>p.nutrition[k]!==''&&p.nutrition[k]!=null).map(([k,l,u])=>`<div class="info-row"><span>${l}</span><span>${esc(p.nutrition[k])} ${u}</span></div>`).join('')}`:'<div class="info-row"><span>まだ登録されていません</span></div>'}</details></div></section><section class="group"><h3 class="group-title">この商品の在庫 · ${ss.length}個</h3><div class="info">${ss.map(s=>`<button class="product-stock" data-stock="${s.id}"><span>${status(s)}<span class="sub">賞味期限 ${date(s.expiry)}</span></span><span class="chevron">›</span></button>`).join('')}</div></section><div class="actions"><button class="primary" data-existing="${p.id}">この商品をもう一本追加</button></div>`}
function choose(){return bar('在庫を追加','cancel','キャンセル')+`<div class="form-intro"><div class="step">1 / 2 · 商品を選ぶ</div><h2>どの商品ですか？</h2><p>登録済みの商品なら、入力を省けます。</p></div><section class="group"><div class="info">${products.map(p=>`<button class="stock-row" data-existing="${p.id}">${icon(p)}<span class="stock-main"><span class="name">${esc(p.name)}</span><span class="sub">${esc(p.type)} · ${esc(p.size)}</span></span><span class="chevron">›</span></button>`).join('')}</div></section>`}
function nutritionFields(n={}){return `<details class="nutrition-fields"><summary>栄養成分を入力（任意）</summary><div class="nutrition-body"><p class="note">ラベルに記載された基準量と値を、そのまま入力します。</p><div class="inline-grid"><label class="field"><span class="field-label">基準量</span><input name="basisQuantity" type="number" min="0.001" step="any" placeholder="例：15" value="${esc(n.basisQuantity)}"></label><label class="field"><span class="field-label">基準単位</span><input name="basisUnit" maxlength="20" placeholder="例：mL、g" value="${esc(n.basisUnit)}"></label></div>${[['energy','エネルギー','kcal'],['protein','たんぱく質','g'],['fat','脂質','g'],['carbohydrate','炭水化物','g'],['salt','食塩相当量','g']].map(([key,label,unit])=>`<label class="field"><span class="field-label">${label}（${unit}）</span><input name="${key}" type="number" min="0" step="any" placeholder="未登録" value="${esc(n[key])}"></label>`).join('')}<p class="note">単位の自動換算は行いません。</p></div></details>`}
function typeOptions(selected=''){const options=[...types];if(selected&&!options.includes(selected))options.push(selected);return '<option value="">タイプを選択</option>'+options.map(t=>`<option value="${esc(t)}" ${selected===t?'selected':''}>${esc(t)}</option>`).join('')}
function setTypeEditorOpen(open){typeEditorOpen=open;const button=document.getElementById('addTypeButton');button.setAttribute('aria-expanded',String(open));button.hidden=open;const select=document.getElementById('savedType');select.disabled=open;const save=app.querySelector('.form-actions button');if(save)save.disabled=open}
function openTypeEditor(){setTypeEditorOpen(true);document.getElementById('typeEditor').innerHTML='<div class="type-editor"><label class="field-label" for="newTypeName">新しいタイプ名</label><input id="newTypeName" maxlength="30" placeholder="例：スパイス、だし" autocomplete="off"><p id="typeError" class="type-error" role="status"></p><div class="type-editor-actions"><button type="button" class="secondary" data-action="canceltype">キャンセル</button><button type="button" class="primary" data-action="applytype">追加して選択</button></div></div>';document.getElementById('newTypeName').focus()}
function closeTypeEditor(){document.getElementById('typeEditor').innerHTML='';setTypeEditorOpen(false);document.getElementById('addTypeButton').focus()}
function applyType(){const input=document.getElementById('newTypeName'),name=input.value.trim();if(!name||name.length>30){document.getElementById('typeError').textContent=!name?'タイプ名を入力してください':'30文字以内で入力してください';input.focus();return}const available=[...types,draft.new?.type].filter(Boolean);const existing=available.find(t=>t.toLocaleLowerCase()===name.toLocaleLowerCase());const selectedType=existing||name;draft.new={...draft.new,type:selectedType};document.getElementById('savedType').innerHTML=typeOptions(selectedType);document.getElementById('savedType').value=selectedType;closeTypeEditor();toast(existing?'登録済みのタイプを選択しました':'新しいタイプを選択しました')}
app.addEventListener('keydown',e=>{if(e.target.id==='newTypeName'&&e.key==='Enter'&&!e.isComposing){e.preventDefault();applyType()}else if(typeEditorOpen&&e.key==='Escape'){e.preventDefault();closeTypeEditor()}});
function newProduct(){let templ=formOrigin==='template',editing=templ&&templateEditId;return bar(templ?(editing?'テンプレートを編集':'テンプレートを追加'):'新しい商品',templ?'templatecancel':'choose',templ?'キャンセル':'戻る')+`<div class="form-intro"><div class="step">${templ?'繰り返し使う商品情報':'1 / 2 · 商品を登録'}</div><h2>${editing?'商品情報を編集':'商品の基本情報'}</h2><p>${templ?'商品名や種類を保存して、次の在庫追加をかんたんに。':'賞味期限や開封日は、次の画面で入力します。'}</p></div><form id="productForm" class="form-body"><div class="field"><span class="field-label">商品画像 <span class="required">任意</span></span><div id="imageEditor">${imageEditor()}</div><p class="note">JPEG・PNG・WebP、5 MBまで。画像はこの画面内だけで使用し、送信しません。</p></div><label class="field"><span class="field-label">商品名 <span class="required">必須</span></span><input name="name" required maxlength="60" placeholder="例：丸大豆しょうゆ" value="${esc(draft.new?.name)}"></label><div class="field"><label class="field-label" for="savedType">タイプ <span class="required">必須</span></label><select id="savedType" name="type" required aria-label="タイプを選択">${typeOptions(draft.new?.type)}</select><button type="button" class="text-btn add-type" id="addTypeButton" data-action="newtype" aria-expanded="false" aria-controls="typeEditor">＋ 新しいタイプを追加</button><div id="typeEditor"></div><p class="note">新しいタイプは、この商品情報の保存時に登録されます。</p></div><label class="field"><span class="field-label">メーカー <span class="required">任意</span></span><input name="brand" maxlength="60" placeholder="例：ひなた醸造" value="${esc(draft.new?.brand)}"></label><label class="field"><span class="field-label">内容量 <span class="required">任意</span></span><input name="size" maxlength="30" placeholder="例：500 mL" value="${esc(draft.new?.size)}"></label>${nutritionFields(draft.new?.nutrition)}<p class="note">${templ?'テンプレートの保存だけでは、在庫は増えません。':'栄養成分は未入力でも登録できます。'}</p></form>`}
function templates(){let shown=products.filter(p=>(p.name+p.brand+p.type).includes(templateQuery));return `<header><div class="topline"><span class="date">いつもの商品を、すぐに追加</span><span class="demo">UIモック</span></div><div class="heading-row"><h2>テンプレート</h2></div></header><!--shell-header--><section class="list-tools"><p class="summary">${products.length}件の商品情報</p><label class="search"><input id="templateSearch" aria-label="テンプレートを検索" placeholder="商品名・種類で検索" value="${esc(templateQuery)}"></label></section><section class="content"><div class="section-label"><strong>保存した商品</strong><span>${shown.length}件</span></div><div class="list">${shown.map(p=>`<button class="stock-row" data-template="${p.id}">${icon(p)}<span class="stock-main"><span class="name">${esc(p.name)}</span><span class="sub">${esc(p.type)} · ${esc(p.size||'内容量未設定')}</span><span class="pill">在庫 ${stocks.filter(x=>x.pid===p.id).length}個</span></span><span class="chevron">›</span></button>`).join('')||'<div class="empty">テンプレートが見つかりません<br>右下の＋から追加できます</div>'}</div><p class="footnote">商品情報はテンプレートに<br>賞味期限・開封日は一本ごとの在庫に</p></section>`}
function templateDetail(){let p=prod(templateId),n=p.nutrition;return bar('テンプレート','templates')+`<div class="detail-hero">${icon(p)}<h2>${esc(p.name)}</h2><span class="sub">${esc(p.brand||'メーカー未設定')}</span></div><section class="group"><h3 class="group-title">在庫追加で使う商品情報</h3><div class="info"><div class="info-row"><span>種類</span><span>${esc(p.type)}</span></div><div class="info-row"><span>内容量</span><span>${esc(p.size||'未設定')}</span></div></div></section><section class="group"><h3 class="group-title">栄養成分（任意）</h3><div class="info">${n?`<div class="info-row"><span>基準量</span><span>${esc(n.basisQuantity)} ${esc(n.basisUnit)} あたり</span></div>${[['energy','エネルギー','kcal'],['protein','たんぱく質','g'],['fat','脂質','g'],['carbohydrate','炭水化物','g'],['salt','食塩相当量','g']].filter(([k])=>n[k]!==''&&n[k]!=null).map(([k,l,u])=>`<div class="info-row"><span>${l}</span><span>${esc(n[k])} ${u}</span></div>`).join('')}`:'<div class="info-row"><span>まだ登録されていません</span></div>'}</div></section><div class="actions"><button class="primary" data-existing="${p.id}">このテンプレートで在庫を追加</button><button class="secondary" data-action="templateedit">テンプレートを編集</button></div><p class="footnote">この商品の在庫：${stocks.filter(x=>x.pid===p.id).length}個</p>`}
function imageEditor(){return `<div class="image-editor">${draft.new?.image?`<img class="image-preview" src="${esc(draft.new.image)}" alt="選択した商品画像">`:'<div class="image-placeholder">画像なし</div>'}<div class="image-buttons"><label class="secondary file-button">${draft.new?.image?'画像を変更':'画像を選ぶ'}<input id="productImage" type="file" accept="image/jpeg,image/png,image/webp" aria-label="商品画像を選ぶ"></label>${draft.new?.image?'<button type="button" class="text-btn" data-action="removeimage">画像を削除</button>':''}</div></div>`}
function settings(){return `<header><div class="topline"><span class="date">自分に合った使い方に</span><span class="demo">UIモック</span></div><div class="heading-row"><h2>設定</h2></div></header><!--shell-header--><p class="settings-intro">在庫入力と、表示の初期設定</p><section class="group"><h3 class="group-title">在庫の設定</h3><div class="info settings-body"><label class="field"><span class="field-label">追加時の保管場所</span><select id="defaultLocation">${['常温','冷蔵庫','冷凍庫'].map(x=>`<option ${preferences.location===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field"><span class="field-label">「期限が近い」の範囲</span><select id="soonDays">${[7,14,30].map(x=>`<option value="${x}" ${preferences.soonDays===x?'selected':''}>${x}日以内</option>`).join('')}</select></label><p class="note">期限を過ぎた在庫も含みます。変更はすぐに反映されます。</p></div></section><section class="group"><h3 class="group-title">このデモについて</h3><div class="info settings-body"><p class="settings-note">架空の商品と、2026年10月2日を基準にしています。画像・タイプ・在庫・設定は、この画面を開いている間だけ有効です。再読み込みすると元に戻ります。</p><p class="note">クラウド同期・通知は、このモックでは利用できません。</p></div></section>`}
function tabbar(){return `<nav class="bottom-nav" aria-label="メインタブ"><button data-tab="stock" aria-current="${activeTab==='stock'?'page':'false'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 10h16M9 15h6"/></svg><span>在庫</span></button><button data-tab="templates" aria-current="${activeTab==='templates'?'page':'false'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="7" y="3" width="13" height="17" rx="2"/><path d="M4 7v13a3 3 0 0 0 3 3M11 8h5M11 12h5"/></svg><span>テンプレート</span></button><button data-tab="settings" aria-current="${activeTab==='settings'?'page':'false'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="9" cy="18" r="2"/></svg><span>設定</span></button></nav>`}
function inventoryForm(){let p=draft.new||prod(draft.pid);return bar('在庫を追加','addback')+`<div class="form-intro"><div class="step">2 / 2 · 一本ごとの在庫情報</div><h2>この一本を登録</h2></div><form id="stockForm" class="form-body"><div class="product-selected">${icon(p)}<span><span class="name">${esc(p.name)}</span><span class="sub">${esc(p.type)} · ${esc(p.size||'内容量未設定')}</span></span></div><label class="field"><span class="field-label">賞味期限 <span class="required">任意</span></span><input type="date" name="expiry" value="${esc(draft.expiry||'')}"></label><div class="field"><span class="field-label">開封状態</span><div class="choice"><button type="button" class="${!draft.opened?'active':''}" data-open="no">未開封</button><button type="button" class="${draft.opened?'active':''}" data-open="yes">開封済み</button></div></div>${draft.opened?`<label class="field"><span class="field-label">開封日</span><input type="date" required name="opened" max="${TODAY}" value="${draft.opened}"></label>`:''}<label class="field"><span class="field-label">保管場所</span><select name="location">${['常温','冷蔵庫','冷凍庫'].map(x=>`<option ${draft.location===x?'selected':''}>${x}</option>`).join('')}</select></label><p class="note">デモ操作です。実際のデータは保存されません。</p></form>`}
function footerActions(){if(view==='new')return `<div class="form-actions"><button type="submit" form="productForm" class="primary">${formOrigin==='template'?'テンプレートを保存':'在庫情報へ'}</button></div>`;if(view==='form')return '<div class="form-actions"><button type="submit" form="stockForm" class="primary">在庫を追加</button></div>';if(view==='choose')return '<div class="form-actions"><button class="secondary" data-action="newproduct">新しい商品を登録</button></div>';return ''}
function shellMarkup(){const html=({list,detail,product:productDetail,choose,new:newProduct,form:inventoryForm,templates,templateDetail,settings}[view])();const [head,body]=html.split('<!--shell-header-->');const floating=view==='list'||view==='templates';const label=view==='list'?'在庫を追加':'テンプレートを追加';return `<div class="shell-header">${head}</div><div class="body-frame"><div class="screen ${floating?'has-fab':''}" tabindex="-1">${body}</div>${floating?`<button class="fab" data-action="${view==='list'?'add':'templateadd'}" aria-label="${label}" title="${label}"><span aria-hidden="true">+</span></button>`:''}</div><div class="shell-footer">${footerActions()}${tabbar()}</div>`}
function render(resetScroll=true){typeEditorOpen=false;const top=resetScroll?0:(app.querySelector?.('.screen')?.scrollTop||0);app.innerHTML=shellMarkup();app.querySelector?.('.screen')?.scrollTo({top,behavior:'instant'})}
function toast(msg,undo){clearTimeout(toastTimer);undoAction=undo;let el=document.getElementById('toast');el.innerHTML=`<span>${esc(msg)}</span>${undo?'<button id="undo">取り消す</button>':''}`;el.className='show';toastTimer=setTimeout(()=>{el.className='';undoAction=null},10000)}
function saveDraft(){let f=document.getElementById('stockForm');if(f){let fd=new FormData(f);draft.expiry=fd.get('expiry');draft.location=fd.get('location');if(draft.opened)draft.opened=fd.get('opened')||TODAY}}
app.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){activeTab=b.dataset.tab;view=activeTab==='stock'?'list':activeTab==='settings'?'settings':'templates';draft={};render();return}if(b.dataset.template){templateId=+b.dataset.template;view='templateDetail';render();return}if(b.dataset.filter){filter=b.dataset.filter;render();return}if(b.dataset.stock){activeTab='stock';selected=+b.dataset.stock;view='detail';render();return}if(b.dataset.product){draft.productId=+b.dataset.product;view='product';render();return}if(b.dataset.existing){returnView=view==='product'?'product':activeTab==='templates'?'templateDetail':'choose';formOrigin='stock';draft={productId:+b.dataset.existing,pid:+b.dataset.existing,opened:'',location:preferences.location};view='form';render();return}if(b.dataset.open){saveDraft();draft.opened=b.dataset.open==='yes'?TODAY:'';render();return}let a=b.dataset.action;if(a==='newtype'){openTypeEditor();return}if(a==='canceltype'){closeTypeEditor();return}if(a==='applytype'){applyType();return}if(a==='removeimage'){imageVersion++;draft.new={...draft.new,image:''};document.getElementById('imageEditor').innerHTML=imageEditor();return}if(a==='templates'){activeTab='templates';view='templates'}else if(a==='templateadd'){formOrigin='template';templateEditId=null;draft={};view='new'}else if(a==='templateedit'){formOrigin='template';templateEditId=templateId;draft={new:{...prod(templateId)}};view='new'}else if(a==='templatecancel'){view=templateEditId?'templateDetail':'templates';draft={}}else if(a==='add'){formOrigin='stock';returnView='choose';draft={};view='choose'}else if(a==='list'||a==='cancel'){view='list'}else if(a==='choose'){view='choose'}else if(a==='newproduct'){formOrigin='stock';draft={location:preferences.location};view='new'}else if(a==='addback'){saveDraft();view=draft.new?'new':returnView}else if(a==='detail'){view='detail'}else if(a==='openstock'){let s=stock(selected);s.opened=TODAY;toast('開封済みにしました',()=>{s.opened='';render()})}else if(a==='useup'){let s=stock(selected),idx=stocks.indexOf(s);stocks.splice(idx,1);view='list';toast('使い切り済みにしました',()=>{stocks.splice(idx,0,s);render()})}else return;render()});
app.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;let pos=e.target.selectionStart;render(false);let f=document.getElementById('search');f.focus();f.setSelectionRange(pos,pos)}else if(e.target.id==='templateSearch'){templateQuery=e.target.value;let pos=e.target.selectionStart;render(false);let f=document.getElementById('templateSearch');f.focus();f.setSelectionRange(pos,pos)}});
